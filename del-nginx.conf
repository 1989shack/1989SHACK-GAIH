cd C:\nginx\conf
del nginx.conf
$L=@()
$L+="worker_processes 1;"
$L+="events{worker_connections 1024;}"
$L+="http{"
$L+="include mime.types;"
$L+="sendfile on;"
$L+="server{"
$L+="listen 80;"
$L+="server_name 1989shack.com bloodbrothers.net www.1989shack.com;"
$L+="location /{proxy_pass http://localhost:3004;proxy_set_header Host `$host;}"
$L+="}"
$L+="server{"
$L+="listen 80;"
$L+="server_name app.1989shack.com;"
$L+="location /{proxy_pass http://localhost:8000;proxy_set_header Host `$host;}"
$L+="}"
$L+="server{"
$L+="listen 80;"
$L+="server_name lifeinternationalschool.lr stmathew.lr www.lifeinternationalschool.lr www.stmathew.lr;"
$L+="location /{proxy_pass http://localhost:3001;proxy_set_header Host `$host;}"
$L+="}"
$L+="server{"
$L+="listen 80;"
$L+="server_name _;"
$L+="location /{proxy_pass http://localhost:3004;proxy_set_header Host `$host;}"
$L+="}"
$L+="}"
$T=$L -join "`r`n"
[System.IO.File]::WriteAllText("C:\nginx\conf\nginx.conf",$T,[System.Text.Encoding]::ASCII)
type C:\nginx\conf\nginx.conf
cd C:\nginx
.\nginx -t
.\nginx
curl http://localhost:80 -Headers @{Host='1989shack.com'}
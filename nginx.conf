# ========== NGINX - OWNERSHIP + DRIVE + SCHOOL - BOTH LIVE ==========
cd C:\nginx\conf
copy nginx.conf nginx.conf.bak
$S=[char]32
$N=@()
$N+="worker_processes 1;"
$N+="events { worker_connections 1024; }"
$N+="http {"
$N+="    include mime.types;"
$N+="    sendfile on;"
$N+="    server {"
$N+="        listen 80;"
$N+="        server_name 1989shack.com bloodbrothers.net www.1989shack.com;"
$N+="        location / { proxy_pass http://localhost:3004; proxy_set_header Host `$host; proxy_set_header X-Real-IP `$remote_addr; }"
$N+="    }"
$N+="    server {"
$N+="        listen 80;"
$N+="        server_name app.1989shack.com;"
$N+="        location / { proxy_pass http://localhost:8000; proxy_set_header Host `$host; proxy_set_header X-Real-IP `$remote_addr; }"
$N+="    }"
$N+="    server {"
$N+="        listen 80;"
$N+="        server_name lifeinternationalschool.lr stmathew.lr www.lifeinternationalschool.lr www.stmathew.lr;"
$N+="        location / { proxy_pass http://localhost:3001; proxy_set_header Host `$host; proxy_set_header X-Real-IP `$remote_addr; }"
$N+="    }"
$N+="    server {"
$N+="        listen 80;"
$N+="        server_name _;"
$N+="        location / { proxy_pass http://localhost:3004; proxy_set_header Host `$host; }"
$N+="    }"
$N+="}"
$N | Set-Content -Encoding ascii nginx.conf
type nginx.conf
cd C:\nginx
nginx -s reload
Write-Host "=== NGINX RELOADED - OWNERSHIP + DRIVE + SCHOOL ===" -ForegroundColor Green
curl http://localhost:80 -Headers @{Host='1989shack.com'}
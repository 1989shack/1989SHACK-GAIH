<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>DUALA MARKET - PHOTOS</title><style>body{font-family:Arial;background:#fff8e1;margin:0} .header{background:#b71c1c;color:white;padding:12px;text-align:center} .products{display:flex;flex-wrap:wrap;justify-content:center} .card{border:2px solid #b71c1c;width:160px;margin:6px;padding:8px;background:white;border-radius:8px;text-align:center} .card img{width:100%;height:100px;object-fit:cover;border-radius:5px;background:#eee} button{background:#2e7d32;color:white;border:none;padding:8px;width:100%;border-radius:5px;margin-top:5px} .cart{background:#000;color:#0f0;padding:12px;position:sticky;bottom:0;text-align:center;font-weight:bold} .kekeh{background:#ffeb3b;padding:10px;margin:10px;border-radius:8px;text-align:center;display:none}</style></head><body>
<div class="header"><h1>🛒 1989SHACK - DUALA MARKET ONLINE</h1><p>From Duala to Your Door - Same Day Kekeh! 🛺</p><p>Duala Market, Bushrod Island | MoMo Pay: 088XXXXX</p></div>
<div class="products">
<div class="card"><img src="images/lappa.jpg" onerror="this.src='https://via.placeholder.com/150?text=Lappa'"><h3>Lappa</h3><p>L$2,500</p><button onclick="add('Lappa',2500)">Add to Cart</button></div>
<div class="card"><img src="images/soap.jpg" onerror="this.src='https://via.placeholder.com/150?text=Soap'"><h3>Soap Factory</h3><p>L$150</p><button onclick="add('Soap',150)">Add</button></div>
<div class="card"><img src="images/gari.jpg" onerror="this.src='https://via.placeholder.com/150?text=Gari'"><h3>Gari/Rice</h3><p>L$500</p><button onclick="add('Gari/Rice',500)">Add</button></div>
<div class="card"><img src="images/tools.jpg" onerror="this.src='https://via.placeholder.com/150?text=Tools'"><h3>Phone Tools</h3><p>L$1,200</p><button onclick="add('Phone Tools',1200)">Add</button></div>
</div>
<div style="background:white;padding:10px;margin:10px;border-radius:8px;border:2px solid #b71c1c"><h3>🛞 Choose Delivery - 5 Wheels</h3><select id="wheel" onchange="calcWheel()" style="width:100%;padding:8px"><option value="0">🦶 Foot - FREE - Duala Market</option><option value="150">🛺 Kekeh - L$150 - 30 mins</option><option value="300">🏍️ Bike - L$300 - 20 mins</option><option value="500">🚗 Car - L$500 - 15 mins</option><option value="1000">🚚 Truck - L$1000 - 60 mins</option></select><p id="wheelInfo"></p></div>
<div class="kekeh" id="kekeh" style="background:#ffeb3b;padding:10px;margin:10px;border-radius:8px;text-align:center;display:none">🛺 Rider LIVE</div>
<div class="cart" id="cart">🛒 Cart: 0 | Total: L$0 | MoMo Pay</div>
<script>let c=1,t=1200,w=0,orders=JSON.parse(localStorage.getItem('dualaOrders')||'[]');function calcWheel(){w=parseInt(document.getElementById('wheel').value);let txt=document.getElementById('wheel').options[document.getElementById('wheel').selectedIndex].text;document.getElementById('wheelInfo').innerText='Selected: '+txt;updateCart();}function updateCart(){document.getElementById('cart').innerHTML='🛒 Cart: '+c+' | Total: L$'+t+' | Delivery: L$'+w+' | Grand: L$'+(t+w)+' | <button onclick="order()" style="width:auto;background:yellow;color:black">ORDER NOW</button>';}function order(){let wh=document.getElementById('wheel')...options[document.getElementById('wheel').selectedIndex].text;let grand=t+w;let rider=wh.includes('Kekeh')?'Emmanuel':wh.includes('Bike')?'Kollie':wh.includes('Car')?'James':wh.includes('Truck')?'Big Joe':'You';document.getElementById('kekeh').style.display='block';document.getElementById('kekeh').innerHTML='🛺 '+wh+' - Rider '+rider+' LIVE!<br>Grand Total: L$'+grand+'<br><button onclick="payMomo('+grand+')" style="background:#ff0;color:#000;padding:10px;font-weight:bold;width:100%;margin-top:10px">💰 PAY L$'+grand+' WITH MOMO - *156#</button>';orders.push({time:new Date().toLocaleTimeString(),item:'Phone Tools',total:grand,delivery:wh});localStorage.setItem('dualaOrders',JSON.stringify(orders));}function payMomo(amount){let momoNumber=prompt('Enter Your MoMo Number - To Pay L$'+amount+':','088');if(momoNumber){alert('📱 Dial: *156*2*'+momoNumber+'*'+amount+'#\n\nOr send L$'+amount+' to 088XXXXX via MTN MoMo App\n\nAfter pay - Call Rider Emmanuel 077XXXXX\n\nDuala Market Thanks!');document.getElementById('kekeh').innerHTML+='<br><br>✅ MoMo Payment L$'+amount+' - Check phone!';}}calcWheel();</script>
</body></html>
